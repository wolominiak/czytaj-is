name: Aktualizacja Bazy Islandzkiej
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Filtrowanie danych
        run: |
          curl -L "https://get.feedink.com/e6ed5dacbfe60a3ea12e24759d7d5647" > empik.xml
          python3 -c "
          import re
          import json

          def get_val(item, tag):
              # Szuka tekstu między <tag> a </tag> lub <g:tag> a </g:tag>
              match = re.search(f'<{tag}[^>]*>(.*?)</{tag}>', item, re.DOTALL)
              if not match:
                  match = re.search(f'<g:{tag}[^>]*>(.*?)</g:{tag}>', item, re.DOTALL)
              return match.group(1).strip() if match else ''

          try:
              with open('empik.xml', 'r', encoding='utf-8') as f:
                  content = f.read()

              # Dzielimy plik na poszczególne produkty (item lub product)
              items = re.findall(r'<(item|product).*?>(.*?)</\1>', content, re.DOTALL)
              
              books = []
              keywords = ['son', 'dóttir', 'sson', 'laxness', 'indriðason', 'jónasson', 'stefánsson']

              for _, item_content in items:
                  # Szukamy słów kluczowych w całym bloku produktu
                  if any(key in item_content.lower() for key in keywords):
                      title = get_val(item_content, 'title')
                      author = get_val(item_content, 'author') or get_val(item_content, 'brand')
                      ean = get_val(item_content, 'ean') or get_val(item_content, 'id')
                      image = get_val(item_content, 'image_link') or get_val(item_content, 'image')

                      if ean:
                          books.append({
                              'title': title,
                              'author': author if author else 'Autor Islandzki',
                              'ean': ean,
                              'image': image
                          })

              # Usuwanie duplikatów
              unique_books = list({b['ean']: b for b in books}.values())

              with open('islandia.json', 'w', encoding='utf-8') as f:
                  json.dump(unique_books, f, ensure_ascii=False, indent=2)
              
              print(f'Sukces! Znaleziono {len(unique_books)} ksiazek.')
          except Exception as e:
              print(f'Blad: {e}')
          "

      - name: Commit i Push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add islandia.json
          git commit -m "Aktualizacja bazy: $(date)" || exit 0
          git push
