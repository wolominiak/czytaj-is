name: Aktualizacja Bazy Islandzkiej
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Filtrowanie danych
        run: |
          curl -L "https://get.feedink.com/e6ed5dacbfe60a3ea12e24759d7d5647" > empik.xml
          python3 -c "
          import xml.etree.ElementTree as ET
          import json

          try:
              tree = ET.parse('empik.xml')
              root = tree.getroot()
              books = []
              
              # Klucze islandzkie (końcówki i nazwiska)
              islandic_keys = ['son', 'dóttir', 'sson', 'laxness', 'jónasson', 'indriðason', 'stefánsson', 'sjón', 'magnússon', 'sigurðardóttir']
              
              # Czarna lista (wykluczamy nie-Islandczyków z końcówką -son)
              black_list = ['janson', 'clarkson', 'sanderson', 'patterson', 'robinson', 'grisham', 'king', 'steele', 'dickinson', 'morrison', 'wilson', 'nelson', 'harrison']

              for offer in root.findall('.//o'):
                  title = (offer.get('name') or '').strip()
                  if not title:
                      name_tag = offer.find('name')
                      title = name_tag.text if name_tag is not None else ''

                  # Zbieramy dane z atrybutów <a>
                  author = 'Autor Islandzki'
                  all_attrs_text = ''
                  for a in offer.findall('.//a'):
                      attr_val = a.text if a.text else ''
                      all_attrs_text += ' ' + attr_val
                      # Próba precyzyjnego złapania autora
                      if a.get('name', '').lower() in ['autor', 'producent', 'author']:
                          author = attr_val

                  # Szukamy w tytule i wszystkich atrybutach
                  search_stack = (title + ' ' + all_attrs_text).lower()
                  
                  # Logika: musi mieć islandzki klucz i NIE może być na czarnej liście
                  is_islandic = any(key in search_stack for key in islandic_keys)
                  is_blocked = any(blocked in search_stack for blocked in black_list)

                  if is_islandic and not is_blocked:
                      ean = offer.get('id') or ''
                      img_tag = offer.find('.//main')
                      image = img_tag.get('url') if img_tag is not None else ''

                      if title and ean:
                          books.append({
                              'title': title,
                              'author': author,
                              'ean': ean,
                              'image': image
                          })

              # Usuwanie duplikatów po EAN
              unique = list({b['ean']: b for b in books}.values())
              
              with open('islandia.json', 'w', encoding='utf-8') as f:
                  json.dump(unique, f, ensure_ascii=False, indent=2)
              
              print(f'SUKCES: Znaleziono {len(unique)} pozycji.')
          except Exception as e:
              print(f'BLAD: {str(e)}')
          "

      - name: Zapisz do repozytorium
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add islandia.json
          git commit -m "Automatyczna aktualizacja bazy" || echo "Brak zmian"
          git push
