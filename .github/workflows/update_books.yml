name: Aktualizacja Bazy Islandzkiej
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Filtrowanie danych
        run: |
          curl -L "https://get.feedink.com/e6ed5dacbfe60a3ea12e24759d7d5647" > empik.xml
          python3 -c "
          import xml.etree.ElementTree as ET
          import json

          def simplify_text(text):
              # Zamienia islandzkie i polskie znaki na podstawowe łacińskie
              chars = {'ð':'d','þ':'th','á':'a','é':'e','í':'i','ó':'o','ú':'u','ý':'y','æ':'ae','ö':'o','ć':'c','ł':'l','ń':'n','ó':'o','ś':'s','ź':'z','ż':'z','ą':'a','ę':'e'}
              text = text.lower()
              for k, v in chars.items():
                  text = text.replace(k, v)
              return text

          try:
              tree = ET.parse('empik.xml')
              root = tree.getroot()
              books = []
              
              white_list = [
                  'Halldór Laxness', 'Gunnar Gunnarsson', 'Einar Kárason', 
                  'Hallgrímur Helgason', 'Yrsa Sigurðardóttir', 'Sjón', 
                  'Arnaldur Indriðason', 'Linda Vilhjálmsdóttir', 'Bragi Ólafsson', 
                  'Sigríður Hagalín Björnsdóttir', 'Andri Snær Magnason', 
                  'Steinar Bragi', 'Elísabet Jökulsdóttir', 'Jón Kalman Stefánsson', 
                  'Eva Björg Ægisdóttir', 'Áslaug Jónsdóttir'
              ]

              # Przygotowujemy uproszczoną listę do porównań
              simplified_white_list = [simplify_text(name) for name in white_list]

              for offer in root.findall('.//o'):
                  # Zbieramy dane z produktu
                  title = (offer.get('name') or '').strip()
                  attrs_text = ''
                  author_found = 'Autor Islandzki'
                  
                  for a in offer.findall('.//a'):
                      val = (a.text or '').strip()
                      attrs_text += ' ' + val
                      if a.get('name', '').lower() in ['autor', 'producent', 'author']:
                          author_found = val

                  # Tekst do przeszukania w wersji uproszczonej
                  search_content_raw = (title + ' ' + attrs_text).lower()
                  search_content_simple = simplify_text(search_content_raw)
                  
                  match = None
                  for i, simple_name in enumerate(simplified_white_list):
                      # Szukamy uproszczonego nazwiska w uproszczonym tekście
                      if simple_name in search_content_simple:
                          match = white_list[i]
                          break

                  if match:
                      ean = offer.get('id') or ''
                      img_tag = offer.find('.//main')
                      image = img_tag.get('url') if img_tag is not None else ''

                      if title and ean:
                          books.append({
                              'title': title,
                              'author': match, # Zawsze zapisujemy ładne nazwisko z listy
                              'ean': ean,
                              'image': image
                          })

              unique = list({b['ean']: b for b in books}.values())
              unique.sort(key=lambda x: x['title'])

              with open('islandia.json', 'w', encoding='utf-8') as f:
                  json.dump(unique, f, ensure_ascii=False, indent=2)
              
              print(f'SUKCES: Znaleziono {len(unique)} pozycji.')
          except Exception as e:
              print(f'BLAD: {str(e)}')
          "

      - name: Zapisz do repozytorium
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add islandia.json
          git commit -m "Aktualizacja bazy - odporna na znaki specjalne" || echo "Brak zmian"
          git push
