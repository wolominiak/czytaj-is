name: Aktualizacja Bazy Islandzkiej
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Filtrowanie danych
        run: |
          curl -L "https://get.feedink.com/e6ed5dacbfe60a3ea12e24759d7d5647" > empik.xml
          python3 -c "
          import xml.etree.ElementTree as ET
          import json

          try:
              tree = ET.parse('empik.xml')
              root = tree.getroot()
              books = []
              
              # TWOJA BIAŁA LISTA AUTORÓW
              white_list = [
                  'Halldór Laxness', 'Gunnar Gunnarsson', 'Einar Kárason', 
                  'Hallgrímur Helgason', 'Yrsa Sigurðardóttir', 'Sjón', 
                  'Arnaldur Indriðason', 'Linda Vilhjálmsdóttir', 'Bragi Ólafsson', 
                  'Sigríður Hagalín Björnsdóttir', 'Andri Snær Magnason', 
                  'Steinar Bragi', 'Elísabet Jökulsdóttir', 'Jón Kalman Stefánsson', 
                  'Eva Björg Ægisdóttir', 'Áslaug Jónsdóttir'
              ]

              # Konwersja na małe litery dla lepszego dopasowania
              white_list_lower = [name.lower() for name in white_list]

              for offer in root.findall('.//o'):
                  # 1. Zbieramy tekst ze wszystkich tagów <a> oraz tytułu
                  # Czasami autor jest w innym miejscu, więc sprawdzamy wszystko
                  attrs_text = ''
                  author_found = ''
                  
                  for a in offer.findall('.//a'):
                      val = (a.text or '').strip()
                      attrs_text += ' ' + val
                      if a.get('name', '').lower() in ['autor', 'producent', 'author']:
                          author_found = val

                  title = (offer.get('name') or '').strip()
                  full_text_to_check = (title + ' ' + attrs_text).lower()
                  
                  # 2. Sprawdzamy, czy którykolwiek autor z listy występuje w danych produktu
                  match = None
                  for i, designer in enumerate(white_list_lower):
                      if designer in full_text_to_check:
                          match = white_list[i] # Zachowujemy oryginalną pisownię nazwiska
                          break

                  if match:
                      ean = offer.get('id') or ''
                      img_tag = offer.find('.//main')
                      image = img_tag.get('url') if img_tag is not None else ''

                      if title and ean:
                          books.append({
                              'title': title,
                              'author': match if not author_found else author_found,
                              'ean': ean,
                              'image': image
                          })

              # Usuwanie duplikatów po EAN
              unique = list({b['ean']: b for b in books}.values())
              
              # Sortowanie po tytule
              unique.sort(key=lambda x: x['title'])

              with open('islandia.json', 'w', encoding='utf-8') as f:
                  json.dump(unique, f, ensure_ascii=False, indent=2)
              
              print(f'SUKCES: Znaleziono {len(unique)} pozycji wybranych autorów.')
          except Exception as e:
              print(f'BLAD: {str(e)}')
          "

      - name: Zapisz do repozytorium
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add islandia.json
          git commit -m "Aktualizacja bazy wg listy autorów" || echo "Brak zmian"
          git push
