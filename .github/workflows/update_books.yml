name: Aktualizacja Bazy Islandzkiej
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Filtrowanie danych
        run: |
          # Pobieramy plik (używamy -L dla przekierowań i -s dla ciszy)
          curl -L "https://get.feedink.com/e6ed5dacbfe60a3ea12e24759d7d5647" > empik.xml
          
          python3 -c "
          import re
          import json

          def simplify(text):
              chars = {'ð':'d','þ':'th','á':'a','é':'e','í':'i','ó':'o','ú':'u','ý':'y','æ':'ae','ö':'o'}
              text = text.lower()
              for k, v in chars.items():
                  text = text.replace(k, v)
              return text

          white_list = [
              'Halldór Laxness', 'Gunnar Gunnarsson', 'Einar Kárason', 
              'Hallgrímur Helgason', 'Yrsa Sigurðardóttir', 'Sjón', 
              'Arnaldur Indriðason', 'Linda Vilhjálmsdóttir', 'Bragi Ólafsson', 
              'Sigríður Hagalín Björnsdóttir', 'Andri Snær Magnason', 
              'Steinar Bragi', 'Elísabet Jökulsdóttir', 'Jón Kalman Stefánsson', 
              'Eva Björg Ægisdóttir', 'Áslaug Jónsdóttir'
          ]

          try:
              with open('empik.xml', 'r', encoding='utf-8', errors='ignore') as f:
                  content = f.read()

              # Dzielimy plik na sekcje produktów (szukamy tagów <o ... </o>)
              offers = re.findall(r'<o.*?</o>', content, re.DOTALL)
              print(f'Przeanalizowano {len(offers)} surowych ofert w pliku.')

              books = []
              for offer in offers:
                  offer_simple = simplify(offer)
                  
                  for author_name in white_list:
                      if simplify(author_name) in offer_simple:
                          # Wyciągamy dane prostym szukaniem tekstu
                          title_match = re.search(r'name=\"(.*?)\"', offer) or re.search(r'<name>(.*?)</name>', offer)
                          id_match = re.search(r'id=\"(.*?)\"', offer)
                          img_match = re.search(r'url=\"(.*?)\"', offer) # Szuka pierwszego URL (zazwyczaj zdjęcie)

                          title = title_match.group(1) if title_match else 'Brak tytułu'
                          ean = id_match.group(1) if id_match else ''
                          image = img_match.group(1) if img_match else ''

                          if ean:
                              books.append({
                                  'title': title,
                                  'author': author_name,
                                  'ean': ean,
                                  'image': image
                              })
                          break

              unique = list({b['ean']: b for b in books}.values())
              with open('islandia.json', 'w', encoding='utf-8') as f:
                  json.dump(unique, f, ensure_ascii=False, indent=2)
              
              print(f'SUKCES: Wyłowiono {len(unique)} pozycji.')
          except Exception as e:
              print(f'KRYTYCZNY BLAD: {str(e)}')
          "

      - name: Zapisz do repozytorium
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add islandia.json
          git commit -m "Aktualizacja brute-force" || echo "Brak zmian"
          git push
