name: Aktualizacja Bazy Islandzkiej
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Filtrowanie danych
        run: |
          curl -L "https://get.feedink.com/e6ed5dacbfe60a3ea12e24759d7d5647" > empik.xml
          python3 -c "
          import re
          import json

          def simplify(text):
              chars = {'ð':'d','þ':'th','á':'a','é':'e','í':'i','ó':'o','ú':'u','ý':'y','æ':'ae','ö':'o'}
              text = text.lower()
              for k, v in chars.items():
                  text = text.replace(k, v)
              return text

          white_list = [
              'Halldór Laxness', 'Gunnar Gunnarsson', 'Einar Kárason', 
              'Hallgrímur Helgason', 'Yrsa Sigurðardóttir', 'Sjón', 
              'Arnaldur Indriðason', 'Linda Vilhjálmsdóttir', 'Bragi Ólafsson', 
              'Sigríður Hagalín Björnsdóttir', 'Andri Snær Magnason', 
              'Steinar Bragi', 'Elísabet Jökulsdóttir', 'Jón Kalman Stefánsson', 
              'Eva Björg Ægisdóttir', 'Áslaug Jónsdóttir'
          ]

          try:
              with open('empik.xml', 'r', encoding='utf-8', errors='ignore') as f:
                  content = f.read()

              # Szukamy ofert. Wersja zoptymalizowana pod gigantyczny plik.
              offers = re.findall(r'<o.*?</o>', content, re.DOTALL)
              
              books = []
              # Przygotowujemy uproszczone nazwiska wcześniej, żeby nie robić tego w pętli 1.7 mln razy
              simple_white_list = [(name, simplify(name)) for name in white_list]

              for offer in offers:
                  # Najpierw sprawdzamy tylko pola name i atrybuty (pomijamy desc - opis, bo tam jest śmietnik)
                  # Wycinamy fragment przed tagiem <desc> jeśli istnieje
                  clean_part = offer.split('<desc>')[0]
                  clean_part_simple = simplify(clean_part)
                  
                  for original_name, simple_name in simple_white_list:
                      if simple_name in clean_part_simple:
                          # Wyciągamy EAN (ID)
                          id_match = re.search(r'id=\"(.*?)\"', offer)
                          ean = id_match.group(1) if id_match else None
                          
                          if not ean: continue

                          # Wyciągamy Tytuł
                          title_match = re.search(r'name=\"(.*?)\"', offer) or re.search(r'<name>(.*?)</name>', offer)
                          title = title_match.group(1) if title_match else 'Brak tytułu'
                          
                          # Wyciągamy Zdjęcie (tag <main url=...)
                          img_match = re.search(r'<main url=\"(.*?)\"', offer)
                          image = img_match.group(1) if img_match else ''

                          # Bardzo ważne: sprawdzamy czy to nie jest np. tylko 'Sjón' jako część innego słowa
                          # Szukamy całego nazwiska
                          books.append({
                              'title': title[:120], # Ograniczamy długość tytułu
                              'author': original_name,
                              'ean': ean,
                              'image': image
                          })
                          break

              # Usuwanie duplikatów po EAN (bardzo ważne przy 18k wynikach)
              unique = list({b['ean']: b for b in books}.values())
              
              # Ograniczamy do max 1000 najnowszych/najtrafniejszych, żeby strona nie padła
              # (opcjonalnie, ale przy 18k to konieczne dla stabilności Twojego serwera)
              final_list = unique[:1500] 

              with open('islandia.json', 'w', encoding='utf-8') as f:
                  json.dump(final_list, f, ensure_ascii=False, indent=2)
              
              print(f'Przeanalizowano {len(offers)} ofert.')
              print(f'SUKCES: Po selekcji i usunięciu duplikatów wybrano {len(final_list)} pozycji.')
          except Exception as e:
              print(f'BLAD: {str(e)}')
          "

      - name: Zapisz do repozytorium
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add islandia.json
          git commit -m "Finalna selekcja - islandia" || echo "Brak zmian"
          git push
