name: Aktualizacja Bazy Islandzkiej
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Filtrowanie danych
        run: |
          curl -L "https://get.feedink.com/e6ed5dacbfe60a3ea12e24759d7d5647" > empik.xml
          python3 -c "
          import xml.etree.ElementTree as ET
          import json
          import re

          try:
              tree = ET.parse('empik.xml')
              root = tree.getroot()
              books = []
              
              # Bardziej precyzyjne końcówki (sprawdzane na końcach słów)
              islandic_suffixes = r'.*(son|dóttir|sson|sdóttir)$'
              
              # Konkretne nazwiska wybitnych autorów (nie pasujące do wzorca)
              specific_authors = ['laxness', 'sjón', 'kristín marja baldursdóttir', 'audur ava ólafsdóttir']
              
              # Czarna lista autorów (nie-Islandczycy z końcówką son)
              black_list = ['sanderson', 'clarkson', 'patterson', 'robinson', 'grisham', 'king', 'steele', 'dickinson', 'morrison', 'wilson', 'nelson', 'harrison', 'janson', 'simpson', 'abrahamson', 'johansson', 'larsson']

              for offer in root.findall('.//o'):
                  # Szukamy autora w atrybutach
                  author = ''
                  for a in offer.findall('.//a'):
                      if a.get('name', '').lower() in ['autor', 'producent', 'author']:
                          author = (a.text or '').strip()
                          break
                  
                  if not author or author == 'Autor Islandzki':
                      continue

                  author_lower = author.lower()
                  
                  # Sprawdzamy, czy autor jest Islandczykiem
                  is_islandic = False
                  
                  # 1. Czy pasuje do wzorca końcówki (np. Arnaldur Indriðason)
                  if re.match(islandic_suffixes, author_lower):
                      is_islandic = True
                  
                  # 2. Czy jest na liście konkretnych nazwisk
                  if any(name in author_lower for name in specific_authors):
                      is_islandic = True

                  # 3. WYKLUCZENIE: Czy jest na czarnej liście?
                  if any(blocked in author_lower for blocked in black_list):
                      is_islandic = False

                  if is_islandic:
                      title = (offer.get('name') or '').strip()
                      ean = offer.get('id') or ''
                      img_tag = offer.find('.//main')
                      image = img_tag.get('url') if img_tag is not None else ''

                      if title and ean:
                          books.append({
                              'title': title,
                              'author': author,
                              'ean': ean,
                              'image': image
                          })

              # Usuwanie duplikatów
              unique = list({b['ean']: b for b in books}.values())
              
              with open('islandia.json', 'w', encoding='utf-8') as f:
                  json.dump(unique, f, ensure_ascii=False, indent=2)
              
              print(f'SUKCES: Znaleziono {len(unique)} islandzkich pozycji.')
          except Exception as e:
              print(f'BLAD: {str(e)}')
          "

      - name: Zapisz do repozytorium
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add islandia.json
          git commit -m "Precyzyjna filtracja bazy" || echo "Brak zmian"
          git push
