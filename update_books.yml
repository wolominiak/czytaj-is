name: Aktualizacja bazy islandzkiej
on:
  schedule:
    - cron: '0 3 * * *' # Codziennie o 3 rano
  workflow_dispatch: # Pozwala uruchomić ręcznie

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2
      - name: Pobierz i filtruj
        run: |
          # Pobieranie wielkiego pliku i filtrowanie przez 'grep' (bardzo szybkie)
          curl -L "https://get.feedink.com/e6ed5dacbfe60a3ea12e24759d7d5647" > empik.xml
          # Wyciągamy tylko fragmenty z islandzkimi nazwiskami
          # To jest uproszczony skrypt, który stworzy nam bazę JSON
          python3 -c "
          import xml.etree.ElementTree as ET
          import json
          tree = ET.parse('empik.xml')
          root = tree.getroot()
          books = []
          for item in root.findall('.//item'):
              author = item.find('author').text if item.find('author') is not None else ''
              if any(x in author.lower() for x in ['son', 'dóttir', 'laxness']):
                  books.append({
                      'title': item.find('title').text,
                      'author': author,
                      'ean': item.find('ean').text if item.find('ean') is not None else '',
                      'image': item.find('image').text if item.find('image') is not None else ''
                  })
          with open('islandia.json', 'w') as f:
              json.dump(books, f)
          "
      - name: Zapisz zmiany
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add islandia.json
          git commit -m "Aktualizacja bazy książek" || exit 0
          git push
