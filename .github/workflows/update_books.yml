name: Aktualizacja Bazy Islandzkiej
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Filtrowanie danych
        run: |
          curl -L "https://get.feedink.com/e6ed5dacbfe60a3ea12e24759d7d5647" > empik.xml
          python3 -c "
          import xml.etree.ElementTree as ET
          import json

          try:
              tree = ET.parse('empik.xml')
              root = tree.getroot()
              books = []
              
              # LISTA ISLANDZKA (końcówki i konkretne nazwiska)
              islandic_keys = ['son', 'dóttir', 'sson', 'laxness', 'jónasson', 'indriðason', 'stefánsson', 'sjón', 'magnússon']
              
              # CZARNA LISTA (autorzy, których NIE CHCEMY, mimo końcówki son/sson)
              black_list = ['janson', 'clarkson', 'sanderson', 'patterson', 'robinson', 'abrahamson']

              for offer in root.findall('.//o'):
                  title = offer.get('name') or ''
                  if not title:
                      name_tag = offer.find('name')
                      title = name_tag.text if name_tag is not None else ''

                  # Szukamy autora
                  author = ''
                  attrs = offer.findall('.//a')
                  for a in attrs:
                      if a.get('name', '').lower() in ['autor', 'producent']:
                          author = a.text if a.text else ''
                          break
                  
                  author_lower = author.lower()
                  
                  # FILTR: Czy autor brzmi islandzko?
                  is_islandic = any(key in author_lower for key in islandic_keys)
                  
                  # FILTR: Czy autor jest na czarnej liście?
                  is_blocked = any(blocked in author_lower for blocked in black_list)

                  if is_islandic and not is_blocked:
                      ean = offer.get('id') or ''
                      img_tag = offer.find('.//main')
                      image = img_tag.get('url') if img_tag is not None else ''

                      if title and author:
                          books.append({
                              'title': title,
                              'author': author,
                              'ean': ean,
                              'image': image
                          })

              # Usuwanie duplikatów
              unique = list({b['ean']: b for b in books}.values())
              
              with open('islandia.json', 'w', encoding='utf-8') as f:
                  json.dump(unique, f, ensure_ascii=False, indent=2)
              
              print(f'SUKCES: Po filtracji zostało {len(unique)} islandzkich pozycji.')
          except Exception as e:
              print(f'BLAD: {str(e)}')
          "

      - name: Zapisz do repozytorium
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add islandia.json
          git commit -m "Automatyczne czyszczenie bazy" || echo "Brak zmian"
          git push
