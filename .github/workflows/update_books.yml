name: Aktualizacja Bazy Islandzkiej
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Filtrowanie danych
        run: |
          curl -L "https://get.feedink.com/e6ed5dacbfe60a3ea12e24759d7d5647" > empik.xml
          python3 -c "
          import xml.etree.ElementTree as ET
          import json

          def get_text(node, tags):
              for tag in tags:
                  found = node.find(tag)
                  if found is not None and found.text:
                      return found.text
              return ''

          try:
              tree = ET.parse('empik.xml')
              root = tree.getroot()
              books = []
              items = root.findall('.//item') or root.findall('.//product')
              islandic_keywords = ['son', 'dóttir', 'sson', 'laxness', 'indriðason', 'jónasson', 'stefánsson']

              for item in items:
                  author = get_text(item, ['author', 'creator', 'producer'])
                  if any(key in author.lower() for key in islandic_keywords):
                      books.append({
                          'title': get_text(item, ['title', 'name']),
                          'author': author,
                          'ean': get_text(item, ['ean', 'isbn', 'barcode']),
                          'image': get_text(item, ['image', 'img_url', 'enclosure'])
                      })
              
              with open('islandia.json', 'w', encoding='utf-8') as f:
                  json.dump(books, f, ensure_ascii=False, indent=2)
              print(f'Sukces! Znaleziono {len(books)} ksiazek.')
          except Exception as e:
              print(f'Blad: {e}')
          "

      - name: Commit i Push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add islandia.json
          git commit -m "Aktualizacja bazy: $(date)" || exit 0
          git push
