name: Aktualizacja Bazy Islandzkiej

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Filtrowanie danych
        run: |
          curl -L "https://get.feedink.com/e6ed5dacbfe60a3ea12e24759d7d5647" > empik.xml
          python3 -c "
          import re
          import json

          # Funkcja usuwająca polskie i islandzkie ogonki dla pewności dopasowania
          def normalize(text):
              chars = {'ð':'d','þ':'th','á':'a','é':'e','í':'i','ó':'o','ú':'u','ý':'y','æ':'ae','ö':'o','ł':'l','ń':'n','ó':'o','ś':'s','ź':'z','ż':'z','ą':'a','ę':'e'}
              text = text.lower()
              for k, v in chars.items():
                  text = text.replace(k, v)
              return text

          # Twoja lista nazwisk (wersja normalna do zapisu i uproszczona do szukania)
          names_to_check = [
              'Laxness', 'Gunnarsson', 'Kárason', 'Helgason', 
              'Sigurðardóttir', 'Sigurðsson', 'Indriðason', 'Vilhjálmsdóttir', 
              'Ólafsson', 'Björnsdóttir', 'Magnason', 'Bragi', 
              'Jökulsdóttir', 'Stefánsson', 'Ægisdóttir', 'Jónsdóttir'
          ]
          
          search_map = {normalize(n): n for n in names_to_check}

          try:
              with open('empik.xml', 'r', encoding='utf-8', errors='ignore') as f:
                  content = f.read()

              # Wycinamy oferty
              offers = re.findall(r'<o.*?</o>', content, re.DOTALL)
              books = []

              for offer in offers:
                  # Czyścimy ofertę z opisów (desc), żeby nie łapać 'rekomendacji'
                  header_part = offer.split('<desc>')[0]
                  header_simple = normalize(header_part)
                  
                  found_name = None
                  for simple_n, original_n in search_map.items():
                      if simple_n in header_simple:
                          found_name = original_n
                          break
                  
                  if found_name:
                      id_match = re.search(r'id=\"(.*?)\"', offer)
                      # Szukamy nazwy wewnątrz <name>...</name> lub atrybutu name
                      title_match = re.search(r'<name><!\[CDATA\[(.*?)\]\]></name>', offer) or re.search(r'<name>(.*?)</name>', offer)
                      img_match = re.search(r'url=\"(.*?)\"', offer)

                      res_ean = id_match.group(1) if id_match else ''
                      res_title = title_match.group(1) if title_match else 'Książka islandzka'
                      res_img = img_match.group(1) if img_match else ''

                      if res_ean and res_title.upper() != 'EAN':
                          books.append({
                              'title': res_title[:150],
                              'author': found_name,
                              'ean': res_ean,
                              'image': res_img
                          })

              # Unikalne po EAN
              unique = list({b['ean']: b for b in books}.values())
              unique.sort(key=lambda x: x['author'])

              with open('islandia.json', 'w', encoding='utf-8') as f:
                  json.dump(unique, f, ensure_ascii=False, indent=2)
              
              print(f'Przeanalizowano {len(offers)} ofert.')
              print(f'SUKCES: Wyłowiono {len(unique)} pozycji.')
          except Exception as e:
              print(f'BLAD: {str(e)}')
          "

      - name: Zapisz do repozytorium
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git fetch origin main
          git pull origin main --rebase || echo "Brak zmian"
          git add islandia.json
          git commit -m "Aktualizacja bazy - podejscie pancerne" || echo "Brak zmian"
          git push origin main
