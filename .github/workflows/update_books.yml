name: Aktualizacja Bazy Islandzkiej
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Filtrowanie danych
        run: |
          curl -L "https://get.feedink.com/e6ed5dacbfe60a3ea12e24759d7d5647" > empik.xml
          python3 -c "
          import xml.etree.ElementTree as ET
          import json

          try:
              tree = ET.parse('empik.xml')
              root = tree.getroot()
              books = []
              
              # Główne klucze (szukamy tych fraz w polu autora)
              islandic_keys = ['son', 'dóttir', 'sson', 'laxness', 'jónasson', 'indriðason', 'stefánsson', 'sjón', 'ólafsdóttir', 'baldursdóttir', 'sigurðardóttir']
              
              # Lista wykluczeń (autorzy nie-islandzcy, którzy psują wyniki)
              black_list = ['sanderson', 'clarkson', 'patterson', 'robinson', 'grisham', 'king', 'steele', 'dickinson', 'morrison', 'wilson', 'nelson', 'harrison', 'janson', 'simpson', 'abrahamson', 'johansson', 'larsson', 'jackson', 'thompson', 'hanson', 'nicholson', 'mason', 'jason']

              for offer in root.findall('.//o'):
                  # 1. Pobieramy autora z atrybutów <a>
                  author = ''
                  for a in offer.findall('.//a'):
                      if a.get('name', '').lower() in ['autor', 'producent', 'author']:
                          author = (a.text or '').strip()
                          break
                  
                  # Jeśli nie ma autora, nie sprawdzamy dalej
                  if not author:
                      continue

                  author_lower = author.lower()
                  
                  # 2. Sprawdzamy, czy autor pasuje do islandzkich kluczy
                  is_islandic = any(key in author_lower for key in islandic_keys)
                  
                  # 3. Sprawdzamy, czy nie jest na czarnej liście
                  is_blocked = any(blocked in author_lower for blocked in black_list)

                  if is_islandic and not is_blocked:
                      title = (offer.get('name') or '').strip()
                      ean = offer.get('id') or ''
                      
                      # Pobieranie obrazka
                      img_tag = offer.find('.//main')
                      image = img_tag.get('url') if img_tag is not None else ''

                      if title and ean:
                          books.append({
                              'title': title,
                              'author': author,
                              'ean': ean,
                              'image': image
                          })

              # Usuwanie duplikatów po EAN
              unique = list({b['ean']: b for b in books}.values())
              
              # Sortowanie po autorze (opcjonalnie, dla ładu na stronie)
              unique.sort(key=lambda x: x['author'])

              with open('islandia.json', 'w', encoding='utf-8') as f:
                  json.dump(unique, f, ensure_ascii=False, indent=2)
              
              print(f'SUKCES: Znaleziono {len(unique)} pozycji.')
          except Exception as e:
              print(f'BLAD: {str(e)}')
          "

      - name: Zapisz do repozytorium
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add islandia.json
          git commit -m "Aktualizacja bazy islandzkiej" || echo "Brak zmian"
          git push
