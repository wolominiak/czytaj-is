name: Aktualizacja Bazy Islandzkiej
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Filtrowanie danych
        run: |
          curl -L "https://get.feedink.com/e6ed5dacbfe60a3ea12e24759d7d5647" > empik.xml
          python3 -c "
          import re
          import json

          # LISTA NAZWISK (bez imion)
          white_list_surnames = [
              'Laxness', 'Gunnarsson', 'Kárason', 'Helgason', 
              'Sigurðardóttir', 'Sigurðsson', 'Indriðason', 'Vilhjálmsdóttir', 
              'Ólafsson', 'Björnsdóttir', 'Magnason', 'Bragi', 
              'Jökulsdóttir', 'Stefánsson', 'Ægisdóttir', 'Jónsdóttir'
          ]

          try:
              with open('empik.xml', 'r', encoding='utf-8', errors='ignore') as f:
                  content = f.read()

              offers = re.findall(r'<o.*?</o>', content, re.DOTALL)
              books = []

              for offer in offers:
                  # Szukamy autora tylko w odpowiednich tagach atrybutów
                  author_tags = re.findall(r'<a name=\"(?:Autor|Producent|Wykonawca)\".*?>(.*?)</a>', offer, re.IGNORECASE)
                  author_content = ' '.join(author_tags).lower()
                  
                  if not author_content:
                      continue

                  found_match = None
                  for surname in white_list_surnames:
                      # Szukamy nazwiska jako osobnego słowa, żeby nie złapać np. 'Kowalson'
                      if surname.lower() in author_content:
                          found_match = surname
                          break
                  
                  if found_match:
                      # Pobieramy EAN
                      id_match = re.search(r'id=\"(.*?)\"', offer)
                      res_ean = id_match.group(1) if id_match else ''
                      
                      # Pobieramy Tytuł (z obsługą CDATA i bez)
                      title_match = re.search(r'<name><!\[CDATA\[(.*?)\]\]></name>', offer) or re.search(r'<name>(.*?)</name>', offer)
                      res_title = title_match.group(1) if title_match else ''
                      
                      # Pobieramy Zdjęcie
                      img_match = re.search(r'<main url=\"(.*?)\"', offer)
                      res_img = img_match.group(1) if img_match else ''

                      # Odrzucamy błędy typu tytuł 'EAN' i puste rekordy
                      if res_ean and res_title and res_title.upper() != 'EAN':
                          # Wyciągamy pełne imię i nazwisko z XML dla wyświetlania
                          full_author_name = author_tags[0] if author_tags else found_match
                          
                          books.append({
                              'title': res_title[:150],
                              'author': full_author_name,
                              'ean': res_ean,
                              'image': res_img
                          })

              # Usuwanie duplikatów po EAN
              unique = list({b['ean']: b for b in books}.values())
              unique.sort(key=lambda x: x['author'])

              with open('islandia.json', 'w', encoding='utf-8') as f:
                  json.dump(unique, f, ensure_ascii=False, indent=2)
              
              print(f'Przeanalizowano {len(offers)} ofert.')
              print(f'SUKCES: Wyłowiono {len(unique)} pozycji pasujących do nazwisk.')
          except Exception as e:
              print(f'BLAD: {str(e)}')
          "

     - name: Zapisz do repozytorium
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git pull origin main --rebase  # <--- To naprawi błąd (pobierze Twoje zmiany z www)
          git add islandia.json
          git commit -m "Aktualizacja po nazwiskach" || echo "Brak zmian"
          git push origin main
