name: Szpieg Struktury XML
on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Pobieranie pliku i analiza
        run: |
          curl -L "https://get.feedink.com/e6ed5dacbfe60a3ea12e24759d7d5647" > empik.xml
          python3 -c "
          import re
          try:
              with open('empik.xml', 'r', encoding='utf-8') as f:
                  # Czytamy początek pliku
                  head = f.read(5000)
                  
                  # Znajdujemy wszystkie tagi (np. <g:brand> lub <title>)
                  tags = re.findall(r'<([a-zA-Z0-9:_-]+)[ >]', head)
                  unique_tags = sorted(list(set(tags)))
                  
                  print('\n' + '='*30)
                  print('STRUKTURA TWOJEGO PLIKU:')
                  print('='*30)
                  print('Znalezione nazwy pól (tagi):')
                  for tag in unique_tags:
                      print(f'  - {tag}')
                  print('='*30)
                  print('\nFRAGMENT TEKSTU DO ANALIZY:')
                  print(head[:1000])
          except Exception as e:
              print(f'Błąd: {e}')
          "
