name: Aktualizacja Bazy Islandzkiej
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Filtrowanie danych
        run: |
          curl -L "https://get.feedink.com/e6ed5dacbfe60a3ea12e24759d7d5647" > empik.xml
          python3 -c "
          import xml.etree.ElementTree as ET
          import json

          try:
              tree = ET.parse('empik.xml')
              root = tree.getroot()
              books = []
              # Szukamy wszystkich elementów, które mogą być produktem
              items = root.findall('.//item') or root.findall('.//product') or root.findall('.//entry')
              
              keywords = ['son', 'dóttir', 'sson', 'laxness', 'indriðason', 'jónasson']

              for item in items:
                  # Pobieramy CAŁY tekst z wnętrza produktu, ze wszystkich tagów
                  all_text = ' '.join([t.text for t in item.iter() if t.text]).lower()
                  
                  if any(key in all_text for key in keywords):
                      # Próba wyciągnięcia danych z najczęstszych tagów
                      d = {
                          'title': next((item.find(t).text for t in ['title', 'name'] if item.find(t) is not None), 'Brak tytułu'),
                          'author': next((item.find(t).text for t in ['author', 'brand', 'producer', 'creator'] if item.find(t) is not None), 'Autor Islandzki'),
                          'ean': next((item.find(t).text for t in ['ean', 'isbn', 'id', 'g:id'] if item.find(t) is not None), ''),
                          'image': next((item.find(t).text for t in ['image', 'image_link', 'g:image_link'] if item.find(t) is not None), '')
                      }
                      books.append(d)

              with open('islandia.json', 'w', encoding='utf-8') as f:
                  json.dump(books, f, ensure_ascii=False, indent=2)
              print(f'Sukces! Znaleziono {len(books)} pozycji.')
          except Exception as e:
              print(f'Blad: {e}')
          "
      - name: Commit i Push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add islandia.json
          git commit -m "Aktualizacja" || exit 0
          git push
